    footer{color:var(--paper);background:#100e0c}.foot{width:var(--width);display:grid;grid-template-columns:1.3fr .7fr .7fr;gap:3rem;padding:4.5rem 0 2.4rem}.foot h2{max-width:360px;margin:0;font:600 clamp(1.7rem,3vw,2.6rem)/1.04 var(--serif);letter-spacing:-.055em}.foot h2 em{color:var(--gold2)}.foot h3{margin:0 0 .8rem;color:var(--gold2);font:.6rem var(--mono);letter-spacing:.13em;text-transform:uppercase}.foot ul{padding:0;margin:0;list-style:none}.foot li{margin:.45rem 0;color:rgba(241,234,220,.64);font-size:.85rem}.foot a:hover{color:var(--gold2)}.bottom{width:var(--width);margin:auto;padding:1rem 0 1.4rem;border-top:1px solid var(--lightline);color:rgba(241,234,220,.42);font:.55rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}.reveal.show{opacity:1;transform:none}@media(max-width:850px){:root{--width:calc(100% - 2.7rem)}.links{position:fixed;inset:66px 0 0;z-index:99;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:0;padding:2rem 1.35rem 5rem;background:rgba(17,14,12,.98);opacity:0;pointer-events:none;transform:translateX(10%);transition:.35s}.links.open{opacity:1;pointer-events:auto;transform:none}.links a{padding:1rem 0;font-size:1rem}.menu{display:block}.hero{min-height:760px}.scroll-label{display:none}.split,.feature,.band .wrap{grid-template-columns:1fr}.heading{display:block;margin-bottom:2.5rem}.heading .number{display:block;margin-top:1rem}.period,.period:nth-child(3){grid-column:span 12;margin:0;min-height:380px}.period:nth-child(2),.period:nth-child(4){transform:none}.works{grid-template-columns:1fr}.work-card,.work-card:nth-child(3n+2){grid-column:auto;min-height:370px;transform:none}.timeline:before{left:7px}.time{display:block;min-height:auto;padding:0 0 2.5rem 2.5rem}.time:after{left:7px}.time p{max-width:none}.genre-grid{grid-template-columns:1fr}.gcopy{grid-template-columns:1fr;gap:1rem}.shelf{grid-template-columns:repeat(2,1fr)}.artist button{grid-template-columns:56px 1fr auto;gap:.75rem}.artist-tag{display:none}.artist-copy{grid-template-columns:56px 1fr;gap:.75rem}.artist-copy>div:nth-child(2),.artist-copy>div:nth-child(3){grid-column:2}.artist-copy>div:nth-child(3){margin-top:1rem}.facts{width:100%;grid-template-columns:1fr 1fr}.fact{min-height:96px;padding:1rem}.fact:nth-child(even){border-right:0}.opening{grid-template-columns:1fr;gap:2rem;padding:4.4rem 0}.article{width:var(--width)}.article-row{grid-template-columns:1fr;gap:.55rem;padding:2.6rem 0}.quote{padding:2rem 1.4rem 1.7rem 3rem}.quote:before{left:.35rem;top:-2.5rem;font-size:6.5rem}.gallery{grid-template-columns:1fr 1fr;grid-auto-rows:150px}.gallery .visual:first-child{grid-column:span 2}.foot{grid-template-columns:1fr 1fr;gap:2rem}.foot>div:first-child{grid-column:span 2}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="loader" id="loader"><div><i></i><span>Opening the archive</span></div></div>
  <div class="progress" id="progress"></div>
  <div class="intro" id="intro" aria-labelledby="intro-title"><div class="intro-content"><p class="eyebrow light">An interactive digital museum</p><h1 id="intro-title" class="display">Welcome to the History of Philippine Literature Library</h1><p class="copy">Discover the voices, stories, traditions, and imagination that shaped Philippine literature.</p><button class="btn" id="enter">Enter the library <span>→</span></button></div></div>
  <div id="app"></div>
  <script>
    /* ===================== EDIT CONTENT HERE =====================
       Replace titles, descriptions, references, and links in this script.
       This single file uses a small hash router: #home, #precolonial,
       #colonial, #postcolonial, #century, and #work-a-work-id.
    =============================================================== */
    const works = [
      {id:'biag-ni-lam-ang',period:'precolonial',title:'Biag ni Lam-ang',origin:'Ilocos region',form:'Ilocano heroic epic',creator:'Oral tradition',date:'Pre-colonial roots; later written versions',summary:'An extraordinary Ilocano hero searches for his father, returns to court Ines Kannoyan, and faces a sequence of losses and renewals.',context:'Like many oral traditions, the epic changed with each telling. Written versions record only part of a longer performance history.',significance:'Its supernatural motifs, repeated challenges, and oral-performance energy illuminate an epic tradition shaped by family, courtship, and communal memory.',themes:['Heroism','Courtship','Family','Fate','Renewal'],reference:['Encyclopaedia Britannica, “Biag ni Lam-ang.”','https://www.britannica.com/topic/Biag-ni-Lam-ang']},
      {id:'hudhud',period:'precolonial',title:'Hudhud',origin:'Ifugao, Cordillera',form:'Narrative chant cycle',creator:'Ifugao oral tradition',date:'Living heritage',summary:'A cycle of long narrative chants associated with harvest, wakes, kinship, and rice culture.',context:'The Hudhud chants were proclaimed by UNESCO in 2001 and inscribed on the Representative List of Intangible Cultural Heritage in 2008.',significance:'The tradition makes literature communal: it joins work, ritual, memory, musical delivery, and local knowledge in a living performance.',themes:['Memory','Kinship','Rice culture','Ritual','Community'],reference:['UNESCO, “Hudhud chants of the Ifugao.”','https://ich.unesco.org/en/RL/hudhud-chants-of-the-ifugao-00015']},
      {id:'darangen',period:'precolonial',title:'Darangen',origin:'Lake Lanao, Mindanao',form:'Maranao epic chant',creator:'Maranao oral tradition',date:'Living heritage',summary:'An expansive cycle about heroic figures, royal worlds, alliances, journeys, and customary law.',context:'UNESCO describes the Darangen as an epic chant carrying knowledge about customary law, social values, and ideals of heroic conduct.',significance:'Its scale, formal language, and performance context make it an important source for understanding Maranao literary and cultural traditions.',themes:['Honor','Kinship','Courage','Custom','Leadership'],reference:['UNESCO, “Darangen epic chant of the Maranao.”','https://ich.unesco.org/en/RL/darangen-epic-chant-of-the-maranao-of-lake-lanao-00159']},
      {id:'hinilawod',period:'precolonial',title:'Hinilawod',origin:'Panay / Sulodnon tradition',form:'Panay epic',creator:'Panay Bukidnon oral tradition',date:'Oral roots; documented in the 20th century',summary:'The brothers Labaw Donggon, Humadapnon, and Dumalapdap travel through a mythic world of courtship, gods, creatures, and trials.',context:'Published versions are records from oral tradition. Credit the performer, community, recorder, translator, and edition used in your research.',significance:'The epic connects mythic adventure with indigenous knowledge, ancestral places, and the landscape of Panay.',themes:['Journey','Courtship','Supernatural worlds','Kinship','Resilience'],reference:['WorldCat research catalog — find your assigned edition of Hinilawod.','https://search.worldcat.org/']},
      {id:'ibalon',period:'precolonial',title:'Ibalon',origin:'Bicol region',form:'Bicolano heroic narrative',creator:'Oral tradition / later recorders',date:'Oral roots; colonial-era written account',summary:'Retellings follow culture heroes Baltog, Handiong, and Bantong as they confront danger and help establish an imagined homeland.',context:'The best-known version comes through later written recording. Present it carefully as an oral-rooted tradition mediated by colonial-era documentation.',significance:'Ibalon offers a rich place to discuss Bicolano identity, landscape, oral tradition, and the transformation of stories through retelling.',themes:['Founding','Landscape','Courage','Order','Transformation'],reference:['National Commission for Culture and the Arts — research portal.','https://ncca.gov.ph/']},
      {id:'noli-me-tangere',period:'colonial',title:'Noli Me Tangere',origin:'Published in Berlin, 1887',form:'Novel of social critique',creator:'José Rizal',date:'Spanish colonial period',summary:'Crisóstomo Ibarra returns to San Diego hoping to establish a school, but encounters the injustices and entrenched power shaping colonial society.',context:'Published in 1887, the novel became central to discussions of reform, nationalism, education, and late Spanish colonial conditions.',significance:'Rizal blends romance, satire, social observation, and political allegory to make a society’s institutions and private costs visible.',themes:['Justice','Education','Power','Identity','Reform'],reference:['Project Gutenberg, Noli Me Tangere.','https://www.gutenberg.org/ebooks/6737']},
      {id:'el-filibusterismo',period:'colonial',title:'El Filibusterismo',origin:'Published in Ghent, 1891',form:'Political novel',creator:'José Rizal',date:'Spanish colonial period',summary:'The transformed Ibarra returns as Simoun and moves through a colonial world in which students, families, officials, and ordinary people confront injustice.',context:'Published in 1891, the novel is commonly read with Noli Me Tangere but takes its questions of reform, despair, and violence in a darker direction.',significance:'Its symbols, interwoven social worlds, and moral urgency create a searching critique rather than a simple political answer.',themes:['Revolution','Disillusionment','Education','Justice','Sacrifice'],reference:['Project Gutenberg, El Filibusterismo.','https://www.gutenberg.org/ebooks/10676']},
      {id:'dead-stars',period:'colonial',title:'Dead Stars',origin:'Philippines',form:'Modernist short story',creator:'Paz Márquez Benítez',date:'Published 1925',summary:'Alfredo Salazar, engaged to Esperanza, becomes fascinated by Julia Salas. Years later he recognizes how memory has transformed that feeling.',context:'Frequently recognized as a foundational Filipino short story in English, it belongs to the development of Philippine writing in English during the American period.',significance:'Its central image and restrained prose make a subtle study of time, self-deception, and emotional illusion.',themes:['Memory','Love','Illusion','Time','Choice'],reference:['WorldCat research catalog — locate an assigned edition of Dead Stars.','https://search.worldcat.org/']},
      {id:'how-my-brother-leon',period:'colonial',title:'How My Brother Leon Brought Home a Wife',origin:'La Union / rural Philippines',form:'Short story',creator:'Manuel E. Arguilla',date:'Published 1940',summary:'Baldo watches his brother Leon bring Maria from the city to their rural family home, where the landscape becomes a quiet test of belonging.',context:'Published in 1940, the story is a major work of Philippine literature in English, known for its regional setting, sensory language, and first-person child narrator.',significance:'The story uses journey, dialogue, and place to consider family acceptance and the dignity of rural life.',themes:['Homecoming','Family','Place','Acceptance','Rural life'],reference:['WorldCat research catalog — locate an edition of Arguilla’s stories.','https://search.worldcat.org/']},
      {id:'lupang-tinubuan',period:'colonial',title:'Lupang Tinubuan',origin:'Philippines',form:'Tagalog novel',creator:'Narciso G. Reyes',date:'Japanese occupation period',summary:'ADD YOUR VERIFIED SUMMARY HERE. Build this exhibition entry from the edition or learning module your class uses.',context:'The Japanese occupation reshaped publishing conditions and gave increased space to Tagalog writing under wartime restriction and censorship.',significance:'Use this page to connect a text to the conditions of reading and writing under occupation, supported by a verified edition and source.',themes:['Wartime','Home','Community','Language','Memory'],reference:['National Library of the Philippines — research catalog.','https://nlp.gov.ph/']},
      {id:'uhaw-ang-tigang',period:'colonial',title:'Uhaw ang Tigang na Lupa',origin:'Philippines',form:'Tagalog short story',creator:'Liwayway A. Arceo',date:'Japanese occupation period',summary:'ADD YOUR VERIFIED SUMMARY HERE. Replace this museum label with an accurate synopsis tied to your prescribed edition.',context:'During the Japanese occupation, English publication was severely restricted while Tagalog writing and periodicals found increased space under difficult wartime conditions.',significance:'Use properly cited scenes and a verified source to discuss language, family, social expectation, and literary craft.',themes:['Wartime','Desire','Constraint','Family','Resilience'],reference:['National Commission for Culture and the Arts — research portal.','https://ncca.gov.ph/']}
    ];

    const genres = [
      ['✎','Blog','A web-based, often serial form that can combine personal reflection, reporting, criticism, images, links, and reader responses.','Research a Filipino blog as a literary or cultural space. Explain how posting rhythm, hyperlinks, and comments shape its reading experience.'],
      ['▣','Flash Fiction','Very short prose fiction that relies on compression, implication, selected detail, and reader inference.','Find a Philippine journal, workshop, or anthology publishing flash work. Compare how it creates voice and conflict within a small space.'],
      ['✦','Speculative Fiction','An umbrella for stories that imagine altered worlds, futures, technologies, magic, or other departures from realism.','Choose a Filipino work and identify what social concern its imagined world makes newly visible.'],
      ['⌘','Hyper Poetry','Digital poetry using links, animation, sound, image, or nonlinear pathways created by a reader’s interaction.','Map the reader’s choices and describe how interaction changes the poem’s rhythm or meaning.'],
      ['▤','Graphic Narrative','Stories made through image, panel, text, sequence, and page design—including comics, graphic novels, and webcomics.','Analyze a Filipino work’s framing, panel transitions, lettering, and visual pacing.'],
      ['⌁','Textula','A very short poem composed and sent through text messaging, responding creatively to character limits and everyday technology.','Use a credited example and discuss how abbreviation, spacing, and the phone interface shape the form.'],
      ['¶','Creative Nonfiction','Real-world writing that uses literary tools such as scene, voice, structure, and reflection.','Identify how a Filipino writer balances factual responsibility with narrative craft.'],
      ['♡','Chick Lit','A market label for popular fiction often centered on women’s lives, relationships, work, and self-fashioning.','Research a Filipino example and consider whether the label clarifies or limits the work.']
    ];

    const artists = [
      ['Nick Joaquin','National Artist for Literature · 1976','Nick Joaquin (1917–2004), also known as Quijano de Manila, was a major Filipino writer in English whose work explored history, faith, family, and Manila.','The Woman Who Had Two Navels and A Portrait of the Artist as Filipino helped shape Philippine literature in English through a distinctive historical imagination.'],
      ['Edith L. Tiempo','National Artist for Literature · 1999','Edith L. Tiempo (1919–2011) was a poet, fiction writer, critic, and teacher. With Edilberto K. Tiempo, she helped build the Silliman University National Writers Workshop.','Research her poetry and fiction, then replace this sentence with your selected works, awards, and a cited NCCA source.'],
      ['N. V. M. Gonzalez','National Artist for Literature · 1997','N. V. M. Gonzalez (1915–1999) was a novelist, short-story writer, essayist, and teacher whose work is associated with Mindoro and rural Philippine life.','The Winds of April and Mindoro and Beyond are useful starting points for a sourced reading list.'],
      ['Bienvenido Lumbera','National Artist for Literature · 2006','Bienvenido Lumbera (1932–2021) was a poet, critic, librettist, and scholar who advanced the study of Philippine literature in Filipino.','Research his poetry, criticism, and work on Tales of the Manuvu, then add citations required by your school.'],
      ['F. Sionil José','National Artist for Literature · 2001','F. Sionil José (1924–2022) was a novelist, short-story writer, editor, and publisher whose fiction often examines class, land, family, and power.','The Rosales Saga, including Po-on and The Pretenders, offers a sustained fictional exploration of Philippine history and inequality.']
    ];

    // CHANGE IMAGE HERE: this avoids broken image icons. To use real images,
    // replace the line below with: return `<img class="visual" src="YOUR-IMAGE.jpg" alt="${label}">`;
    const art = label => `<div class="visual" role="img" aria-label="${label} placeholder"><span class="sr">${label} placeholder</span></div>`;
    const sectionName = key => key === 'precolonial' ? 'Pre-Colonial' : key === 'colonial' ? 'Colonial' : key === 'postcolonial' ? 'Post-Colonial' : key === 'century' ? '21st Century' : 'Home';
    const navItems = [['Home','home'],['Pre-Colonial','precolonial'],['Colonial','colonial'],['Post-Colonial','postcolonial'],['21st Century','century']];
    const route = () => location.hash.replace('#','') || 'home';
    const go = key => { location.hash = key; };

    function header(active){return `<header id="header"><nav class="nav"><a class="brand" href="#home" aria-label="Library home"><span class="mark"></span><span>History of Philippine<br>Literature Library</span></a><button class="menu" id="menu" aria-label="Open menu"><i></i><i></i><i></i></button><ul class="links" id="links">${navItems.map(([name,key])=>`<li><a class="${active===key?'active':''}" href="#${key}">${name}</a></li>`).join('')}</ul></nav></header>`}
    function footer(){return `<footer><div class="foot"><div><h2>An evolving archive of <em>Filipino voices.</em></h2><p style="max-width:330px;color:rgba(241,234,220,.62);font-size:.89rem">A student-editable digital museum for learning, remembering, and continuing the conversation.</p></div><div><h3>Explore</h3><ul><li><a href="#precolonial">Pre-Colonial</a></li><li><a href="#colonial">Colonial</a></li><li><a href="#postcolonial">Post-Colonial</a></li><li><a href="#century">21st Century</a></li></ul></div><div><h3>Customize</h3><ul><li>Search: CHANGE IMAGE HERE</li><li>Search: EDIT CONTENT HERE</li><li>Replace example.com links</li><li>Verify all research</li></ul></div></div><div class="bottom">© ${new Date().getFullYear()} History of Philippine Literature Library</div></footer><button class="top" id="top" aria-label="Back to top">↑</button>`}
    function home(){return `<main><section class="hero"><div class="orbit"></div><div class="hero-content"><p class="eyebrow light reveal">A living archive of many languages</p><h1 class="display reveal">History of Philippine Literature</h1><p class="lead light reveal">From ancient oral traditions to the voices of the 21st century.</p><div class="actions reveal"><button class="btn" data-scroll="periods">Begin the journey ↓</button><a class="btn ghost" href="#precolonial">Explore literature →</a></div></div><span class="scroll-label">Scroll</span></section><section class="section"><div class="wrap split"><div class="reveal"><p class="eyebrow">The collection</p><h2 class="title">A country remembered in <em>many</em> voices.</h2></div><div class="reveal"><p class="lead">Philippine literature encompasses oral, written, performed, printed, and digital expressions created across the archipelago and its diasporas. It carries local languages, historical change, and the ongoing work of imagining a shared future.</p><p>Stories preserve community knowledge; poems give language to longing and dissent; epics carry landscapes and memory across generations.</p></div></div></section><section class="statement"><div class="wrap"><p class="eyebrow light reveal">Why literature matters</p><p class="display reveal">It is an archive of <em>identity</em>—and a place where identity keeps changing.</p></div></section><section class="section" id="periods"><div class="wrap"><div class="heading"><div class="reveal"><p class="eyebrow">Four exhibition rooms</p><h2 class="title">Travel by period, then stay for the stories.</h2></div><span class="number">02 · The collection</span></div><div class="cards">${[['precolonial','Before 1565','Pre-Colonial','Epics, chants, riddles, myths, and folk songs held in community and performance.',''],['colonial','1565–1945','Colonial','Texts shaped by Spanish, American, and Japanese rule—and by Filipino writers answering back.','v2'],['postcolonial','1946 onwards','Post-Colonial','New freedoms, new urgencies, and experimental forms for contemporary Filipino voices.','v3'],['century','Now / next','21st Century','A networked, multilingual field of stories moving through pages, screens, and communities.','v4']].map(([key,date,title,copy,v])=>`<a class="period reveal" href="#${key}"><div class="card-art ${v}"></div><div class="period-body"><p class="eyebrow light">${date}</p><h3>${title}</h3><p>${copy}</p><span class="text-link">Enter room →</span></div></a>`).join('')}</div></div></section><section class="section dark"><div class="wrap"><div class="heading"><div><p class="eyebrow light">A moving map</p><h2 class="title">Literature evolves; the conversation continues.</h2></div></div><div class="timeline">${[['Before 1565','Pre-Colonial','Oral traditions, indigenous scripts, epics, songs, proverbs, and ritual speech flourish across diverse communities.'],['1565–1898','Spanish','Religious writing, print culture, vernacular forms, and reformist literature reshape literary life.'],['1898–1945','American & Japanese','Writing in English develops alongside Tagalog and regional literatures; war changes publication and language.'],['1946 onwards','Post-Colonial','Writers negotiate independence, dictatorship, migration, regional identity, and changing forms.'],['2000s →','21st Century','Digital publishing, hybrid genres, multilingual practice, and transnational communities widen the field.']].map(x=>`<article class="time reveal"><div><small>${x[0]}</small><h3>${x[1]}</h3><p>${x[2]}</p></div></article>`).join('')}</div></div></section></main>`}
    function pageHero(label,title,copy){return `<section class="page-hero"><div class="crumb"><a href="#home">Home</a> / ${label}</div><div class="hero-content"><p class="eyebrow light reveal">Digital museum · ${label}</p><h1 class="display reveal">${title}</h1><p class="lead light reveal">${copy}</p></div></section>`}
    function workCard(w,i){return `<article class="work-card reveal"><div class="card-art ${['','v2','v3','v4'][i%4]}"></div><div class="work-card-body"><div class="meta"><span>${w.origin}</span><span>${w.form}</span></div><h3>${w.title}</h3><p>${w.summary.slice(0,125)}…</p><a class="text-link" href="#work-${w.id}">Read more →</a></div></article>`}
    function precolonial(){const list=works.filter(w=>w.period==='precolonial');return `<main>${pageHero('Room I · Before 1565','Before the page, there was the voice.','An exhibition of oral tradition, indigenous knowledge, storytelling, epics, myth, song, and communal memory.')}<section class="section"><div class="wrap split"><div class="reveal"><p class="eyebrow">The oral archive</p><h2 class="title">Stories made to be heard, remembered, and renewed.</h2></div><div class="reveal"><p class="lead">Before colonization, communities throughout the archipelago cultivated rich literary traditions in their own languages. Many were transmitted orally: performed at gatherings, woven into ritual, and held in the memory of skilled storytellers.</p><p>“Pre-colonial” is a useful classroom label, but it should not suggest a single culture or a silent past. These traditions remain meaningful to living communities.</p><aside class="note"><b>Research note.</b> Credit the community, performer, recorder, translator, and edition you use.</aside></div></div></section><section class="band"><div class="wrap"><div><p class="eyebrow light">Forms in this room</p><h2>Epics, myths, legends, riddles, folk songs, proverbs, and ritual speech.</h2></div><p>Oral literature can preserve history, teach values, interpret the natural world, and build shared belonging. Its meaning lies in performance as much as in any written transcription.</p></div></section><section class="section"><div class="wrap"><div class="heading"><div><p class="eyebrow">Five exhibition entries</p><h2 class="title">Meet the epics and traditions.</h2></div><span class="number">Select a work · Read the label</span></div><div class="works">${list.map(workCard).join('')}</div></div></section></main>`}
    function colonial(){const s=works.filter(w=>['noli-me-tangere','el-filibusterismo'].includes(w.id)),a=works.filter(w=>['dead-stars','how-my-brother-leon'].includes(w.id)),j=works.filter(w=>['lupang-tinubuan','uhaw-ang-tigang'].includes(w.id));const block=(date,name,copy,list)=>`<section class="colonial"><div class="wrap"><div class="heading"><div><p class="eyebrow ${name==='American Period'?'light':''}">${date}</p><h2 class="title">${name}</h2><p class="lead">${copy}</p></div></div><div class="works">${list.map(workCard).join('')}</div></div></section>`;return `<main>${pageHero('Room II · 1565–1945','Writing under—and against—empire.','Three colonial periods reshaped language, education, print, and literary form. Filipino writers also used literature to question power, imagine reform, and make new publics.')}<section class="section"><div class="wrap split"><div><p class="eyebrow">A layered history</p><h2 class="title">Literary history is never a one-way influence.</h2></div><div><p class="lead">Spanish, American, and Japanese rule altered the conditions in which literature was made and circulated. Writers and readers worked across Tagalog, Spanish, English, and many Philippine languages, adapting forms to local concerns.</p><aside class="note"><b>Curatorial note.</b> Use specific dates, places, languages, and sources when expanding this research.</aside></div></div></section>${block('1565–1898','Spanish Period','Christianization and print culture transformed literary production, while secular forms and reformist writing gave new force to questions of nation, rights, and social justice.',s)}${block('1898–1941','American Period','English-language education helped create new readerships and literary forms, while writers explored regional life, modernity, social expectation, and nation.',a)}${block('1942–1945','Japanese Period','Wartime censorship and hardship constrained literary life. Tagalog writing and periodicals found increased space under the pressures of occupation.',j)}</main>`}
    function postcolonial(){return `<main>${pageHero('Room III · 1946 onwards','After independence: new forms, unfinished questions.','A flexible, interactive reading room for genres and platforms that broaden contemporary Philippine literature.')}<section class="section"><div class="wrap split"><div><p class="eyebrow">Modern voices</p><h2 class="title">Literature responds to a changing public.</h2></div><div><p class="lead">Post-colonial Philippine writing encompasses diverse languages, regions, and social worlds. Authors use fiction, poetry, essays, journalism, comics, and digital platforms to engage independence, authoritarianism, migration, gender, memory, and everyday life.</p><p>Technology changes where stories are encountered, who can publish, and how readers participate.</p></div></div></section><section class="feature"><div class="feature-art"></div><div class="copy"><p class="eyebrow light">A changing medium</p><p class="display">The page becomes a screen. The reader becomes a participant.</p><p class="lead light">Contemporary forms can be brief, visual, nonlinear, serial, collaborative, and instantly shareable—while still grounded in craft, language, and lived experience.</p></div></section><section class="section"><div class="wrap"><div class="heading"><div><p class="eyebrow">Interactive genre index</p><h2 class="title">Open a form. Add your research.</h2></div><span class="number">Cards expand to fit all text</span></div><div class="genre-grid">${genres.map(g=>`<article class="genre reveal"><button data-accordion><span class="icon">${g[0]}</span><span class="gtitle">${g[1]}</span><span class="plus"></span><span class="sr">Expand ${g[1]}</span></button><div class="gpanel"><div><div class="gcopy"><p><strong>Definition & character</strong>${g[2]}</p><p><strong>Research direction</strong>${g[3]}</p></div></div></div></article>`).join('')}</div></div></section></main>`}
    function century(){const books=[['F. Sionil José','Po-on',''],['Nick Joaquin','The Woman Who Had Two Navels','v2'],['Nick Joaquin','A Portrait of the Artist as Filipino','v3'],['F. Sionil José','The Pretenders','v4'],['Your contemporary author','Title to be replaced','v2']];return `<main>${pageHero('Room IV · Now & next','A literature in motion.','Contemporary Philippine writing circulates through books, classrooms, zines, festivals, screens, translations, and diaspora communities—always in more than one language.')}<section class="section"><div class="wrap split"><div><p class="eyebrow">Contemporary field</p><h2 class="title">Many languages. Many regions. Many ways to publish.</h2></div><div><p class="lead">The 21st century extends rather than erases the traditions that came before it. Writers draw from local histories and mythologies while engaging technology, climate, migration, gender, labor, and public life.</p><p>Replace these five cards with the literary works and source links your research requires.</p></div></div></section><section class="section dark" style="padding-top:0"><div class="wrap"><div class="heading"><div><p class="eyebrow light">Featured reading shelf</p><h2 class="title">Canonical foundations & contemporary pathways.</h2></div><span class="number" style="color:rgba(241,234,220,.4)">Five replaceable cards</span></div><div class="shelf">${books.map((b,i)=>`<!-- CHANGE WEBSITE LINK HERE --><a class="book reveal" href="https://example.com" target="_blank" rel="noopener"><div class="card-art ${b[2]}"></div><div class="book-body"><p class="eyebrow light">${b[0]}</p><h3>${b[1]}</h3><p>Replace with a verified overview and source link.</p></div></a>`).join('')}</div></div></section><section class="section"><div class="wrap"><div class="heading"><div><p class="eyebrow">Honored voices</p><h2 class="title">National Artists of Philippine Literature</h2></div><span class="number">Open each profile</span></div><div class="artists">${artists.map(a=>`<article class="artist reveal"><button data-artist><span class="portrait"></span><span class="artist-name">${a[0]}</span><span class="artist-tag">${a[1]}</span><span class="artist-more">Expand</span></button><div class="artist-panel"><div><div class="artist-copy"><span></span><div><strong>Profile</strong><p>${a[2]}</p></div><div><strong>Major works & contribution</strong><p>${a[3]}</p></div></div></div></div></article>`).join('')}</div><div class="refs"><b>Profile source to cite</b><ul><li><a href="https://ncca.gov.ph/about-culture-and-arts/culture-profile/national-artists-of-the-philippines/" target="_blank" rel="noopener">National Commission for Culture and the Arts — National Artists of the Philippines.</a> Verify each profile against the specific NCCA biography you cite.</li></ul></div></div></section></main>`}
    function workPage(w){return `<main><section class="article-hero"><div class="crumb"><a href="#home">Home</a> / <a href="#${w.period}">${sectionName(w.period)}</a> / ${w.title}</div><div class="hero-content"><p class="eyebrow light">Exhibition entry · ${sectionName(w.period)}</p><h1 class="display">${w.title}</h1><p class="lead light">${w.form} · ${w.origin}</p></div></section><section class="facts"><div class="fact"><small>Origin</small><b>${w.origin}</b></div><div class="fact"><small>Creator</small><b>${w.creator}</b></div><div class="fact"><small>Period</small><b>${w.date}</b></div><div class="fact"><small>Form</small><b>${w.form}</b></div></section><article class="article"><section class="opening"><p>${w.summary}</p><aside class="side"><b>Editing this entry</b>Replace the summary, add research approved by your teacher, and credit every image, performer, translator, and source you use.</aside></section><section class="article-row"><div class="row-label">01 · Context</div><div><h2>World around the work</h2><p>${w.context}</p></div></section><blockquote class="quote">An exhibition label should invite careful reading—and make room for the sources, communities, and contexts that sustain a work.</blockquote><section class="article-row"><div class="row-label">02 · Summary</div><div><h2>Story in brief</h2><p>${w.summary}</p></div></section><section class="article-row"><div class="row-label">03 · Themes</div><div><h2>Ideas to trace</h2><ul class="themes">${w.themes.map(t=>`<li>${t}</li>`).join('')}</ul><p><strong>ADD YOUR ANALYSIS HERE.</strong> Use this section to connect specific scenes, formal choices, and properly cited evidence to the themes above.</p></div></section><section class="article-row"><div class="row-label">04 · Gallery</div><div><h2>Visual research board</h2><p><!-- CHANGE IMAGE HERE --> These visual placeholders never break. Replace them with credited maps, manuscripts, performance photographs, or artwork for this entry.</p><div class="gallery">${art(w.title)}${art(w.title)}${art(w.title)}</div><!-- OPTIONAL VIDEO: paste a responsive <video controls> element here. --></div></section><section class="article-row"><div class="row-label">05 · References</div><div><h2>Research shelf</h2><p>Use this as a starting point, then add school-approved books, primary sources, and academic research.</p><div class="refs"><b>Suggested source</b><ul><li><a href="${w.reference[1]}" target="_blank" rel="noopener">${w.reference[0]}</a></li><li>ADD YOUR VERIFIED CLASS OR LIBRARY SOURCE HERE.</li></ul></div></div></section><nav class="article-nav"><a class="btn ghost" href="#${w.period}">← Back to ${sectionName(w.period)}</a><a class="btn" href="#home">Explore archive →</a></nav></article></main>`}
    function render(){const r=route();let active=r,content;if(r==='home')content=home();else if(r==='precolonial')content=precolonial();else if(r==='colonial')content=colonial();else if(r==='postcolonial')content=postcolonial();else if(r==='century')content=century();else if(r.startsWith('work-')){const w=works.find(x=>x.id===r.slice(5));if(!w){go('home');return}active=w.period;content=workPage(w)}else{go('home');return}document.title=`${r.startsWith('work-')?works.find(x=>x.id===r.slice(5)).title+' — ':''}History of Philippine Literature Library`;document.getElementById('app').innerHTML=header(active)+content+footer();window.scrollTo({top:0,behavior:'auto'});wire();reveal()}
    function wire(){document.getElementById('menu')?.addEventListener('click',()=>document.getElementById('links').classList.toggle('open'));document.querySelectorAll('[data-scroll]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'})));document.querySelectorAll('[data-accordion]').forEach(b=>b.addEventListener('click',()=>b.closest('.genre').classList.toggle('open')));document.querySelectorAll('[data-artist]').forEach(b=>b.addEventListener('click',()=>{const row=b.closest('.artist');row.classList.toggle('open');b.querySelector('.artist-more').textContent=row.classList.contains('open')?'Close':'Expand'}));document.getElementById('top')?.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}))}
    function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>io.observe(el))}
    function scrollUI(){const max=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress')?.style.setProperty('--p',`${max?scrollY/max*100:0}%`);document.getElementById('header')?.classList.toggle('scrolled',scrollY>25);document.getElementById('top')?.classList.toggle('show',scrollY>650)}
    addEventListener('hashchange',render);addEventListener('scroll',scrollUI,{passive:true});addEventListener('load',()=>setTimeout(()=>document.getElementById('loader').classList.add('hide'),350));document.getElementById('enter').addEventListener('click',()=>document.getElementById('intro').classList.add('off'));render();scrollUI();
  </script>
